name: Build and publish Plaza release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - deb_arch: i386
            runner: ubuntu-24.04
            platform: linux/386
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - deb_arch: armhf
            runner: ubuntu-24.04
            platform: linux/arm/v7
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Enable emulation for legacy architectures
        if: matrix.deb_arch == 'i386' || matrix.deb_arch == 'armhf'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 386,arm

      - name: Build, test, and package in Debian 13
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace debian:trixie \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build pkg-config dbus \
                libflatpak-dev zlib1g-dev qt6-base-dev qt6-base-dev-tools \
                qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev \
                qt6-tools-dev-tools qt6-svg-dev qml6-module-org-kde-kirigami \
                qt6-base-private-dev qt6-declarative-private-dev dpkg-dev file
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build --parallel 2
              ctest --test-dir build --output-on-failure
              cpack --config build/CPackConfig.cmake -G DEB -B build/packages
              test -f "build/packages/plaza_1.1.1_${{ matrix.deb_arch }}.deb"
            '

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaza-deb-${{ matrix.deb_arch }}
          path: build/packages/*.deb
          if-no-files-found: error

  publish-release:
    needs: build-deb
    runs-on: ubuntu-24.04
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          pattern: plaza-deb-*
          path: packages
          merge-multiple: true

      - name: Publish GitHub release and Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.deb \
            --title "Plaza $GITHUB_REF_NAME" \
            --generate-notes
