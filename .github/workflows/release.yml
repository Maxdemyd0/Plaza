name: Build and publish Plaza release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dbus \
            libflatpak-dev zlib1g-dev qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev \
            qt6-tools-dev-tools qt6-svg-dev qml6-module-org-kde-kirigami \
            qt6-base-private-dev qt6-declarative-private-dev dpkg-dev

      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Package Debian installer
        run: cpack --config build/CPackConfig.cmake -G DEB -B build/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaza-deb
          path: build/packages/*.deb
          if-no-files-found: error

  publish-release:
    needs: build-deb
    runs-on: ubuntu-24.04
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: plaza-deb
          path: packages

      - name: Publish GitHub release and Debian package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.deb \
            --title "Plaza $GITHUB_REF_NAME" \
            --generate-notes
